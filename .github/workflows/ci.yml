name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install -e .[dev]

      - name: Run backend tests
        run: |
          PYTHONPATH=backend .venv/bin/pytest backend/tests -v --cov=app --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npx tsc --noEmit

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install -e .[dev]

      - name: Run ruff
        run: .venv/bin/ruff check .

      - name: Run mypy
        run: .venv/bin/mypy app

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, backend-lint, frontend-lint]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: tensor-workbench-backend:test
          load: true

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: tensor-workbench-frontend:test
          load: true

      - name: Test backend image
        run: |
          docker run --rm -d --name backend-test -p 8000:8000 tensor-workbench-backend:test
          sleep 10
          curl -f http://localhost:8000/api/health
          docker stop backend-test

      - name: Test frontend image
        run: |
          docker run --rm -d --name frontend-test -p 8081:80 tensor-workbench-frontend:test
          sleep 5
          curl -f http://localhost:8081/
          docker stop frontend-test

  check-source-size:
    name: Check Source Size
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate source size
        run: |
          SIZE=$(find . -type f \( -name "*.py" -o -name "*.ts" -o -name "*.tsx" -o -name "*.css" \) \
            ! -path "./.venv/*" \
            ! -path "./frontend/node_modules/*" \
            ! -path "./frontend/dist/*" \
            ! -path "./backend/__pycache__/*" \
            ! -path "./.pytest_cache/*" \
            ! -path "./.git/*" \
            ! -name "*.lock" \
            -exec wc -c {} + | tail -1 | awk '{print $1}')
          echo "Source size: $SIZE bytes"
          if [ "$SIZE" -lt 50000 ] || [ "$SIZE" -gt 150000 ]; then
            echo "ERROR: Source size $SIZE is outside 50,000-150,000 byte range"
            exit 1
          fi
          echo "Source size OK"

  check-required-files:
    name: Check Required Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required files exist
        run: |
          REQUIRED_FILES=(
            "portfolio.json"
            "README.md"
            "LICENSE"
            "CHANGELOG.md"
            "pyproject.toml"
            ".gitignore"
            ".env.example"
            "compose.yaml"
            "backend/requirements.txt"
            "backend/Dockerfile"
            "backend/app/main.py"
            "frontend/Dockerfile"
            "frontend/package.json"
            "frontend/package-lock.json"
            ".github/workflows/ci.yml"
          )
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing required file: $file"
              exit 1
            fi
            echo "OK: $file"
          done
          echo "All required files present"